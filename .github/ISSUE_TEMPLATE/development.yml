name: Development task
description: A bounded engineering change with verifiable acceptance criteria.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended behavior
      description: Describe the trigger, current behavior and required result.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State the observable outcomes and relevant deterministic checks.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Change area
      multiple: true
      options:
        - Documentation
        - Data and research
        - Cockpit
        - PAPER execution and risk
        - CI and security
        - Runtime tooling
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope, dependencies and runtime implications
      description: Identify related PRs and data requirements. Never include credentials or secret values. PAPER remains the default.
    validations:
      required: true
