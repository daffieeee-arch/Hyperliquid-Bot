name: Setup pinned Node.js and pnpm
description: Install SHA-checked Node.js 24.18.1 and pnpm 11.23.0 with an optional store cache.

inputs:
  cache:
    description: Cache the pnpm store using the committed lockfile.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install pinned Node.js
      env:
        NODE_SHA256: d6c664df3f3f61458e8c277585571328522d705166723a7c7823a9253a4d15a0
        NODE_VERSION: 24.18.1
      shell: bash
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/node-v${NODE_VERSION}-linux-x64.tar.xz"
        curl --fail --silent --show-error --location \
          --output "${archive}" \
          "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
        echo "${NODE_SHA256}  ${archive}" | sha256sum --check --strict
        tar --extract --xz --file "${archive}" --directory "${RUNNER_TEMP}"
        echo "${RUNNER_TEMP}/node-v${NODE_VERSION}-linux-x64/bin" >> "${GITHUB_PATH}"

    - name: Set up pnpm
      uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
      with:
        version: 11.23.0
        install: false

    - name: Get pnpm store directory
      if: inputs.cache == 'true'
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"

    - name: Cache pnpm store
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
