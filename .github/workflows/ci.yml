name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
      secrets: ${{ steps.scope.outputs.secrets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify change set
        id: scope
        env:
          PYTHONPATH: src
        run: python3 src/hyperliquid_bot/ci_scope.py

  python-foundation:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Skip docs-only change set
        if: needs.changes.outputs.heavy != 'true'
        run: echo "docs-only PR; heavy Python foundation skipped."

      - name: Check out repository
        if: needs.changes.outputs.heavy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up uv and Python
        if: needs.changes.outputs.heavy == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
          python-version: "3.13.15"
          version: "0.12.5"

      - name: Validate lockfile
        if: needs.changes.outputs.heavy == 'true'
        run: uv lock --check

      - name: Install Python dependencies
        if: needs.changes.outputs.heavy == 'true'
        run: uv sync --frozen --all-groups

      - name: Check Python formatting
        if: needs.changes.outputs.heavy == 'true'
        run: uv run --frozen ruff format --check .

      - name: Lint Python
        if: needs.changes.outputs.heavy == 'true'
        run: uv run --frozen ruff check .

      - name: Type-check Python
        if: needs.changes.outputs.heavy == 'true'
        run: uv run --frozen mypy src tests/python vertical_slices/course1_exit_gate

      - name: Test Python
        if: needs.changes.outputs.heavy == 'true'
        run: uv run --frozen pytest -q

      - name: Verify COURSE-1 exit-gate evidence
        if: needs.changes.outputs.heavy == 'true'
        run: uv run --frozen python -m vertical_slices.course1_exit_gate.verify verify

  d01-publication:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Skip docs-only change set
        if: needs.changes.outputs.heavy != 'true'
        run: echo "docs-only PR; D01 publication gate skipped."

      - name: Check out repository
        if: needs.changes.outputs.heavy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up uv and Python
        if: needs.changes.outputs.heavy == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            fit_gates/d41_nautilus/requirements.lock
          python-version: "3.13.15"
          version: "0.12.5"

      - name: Build exact isolated D01 environment
        if: needs.changes.outputs.heavy == 'true'
        run: |
          set -euo pipefail
          d01_venv="${RUNNER_TEMP}/d01-venv"
          test ! -e "${d01_venv}"
          uv venv --no-project --python 3.13.15 "${d01_venv}"
          uv pip sync --no-cache --strict \
            --python "${d01_venv}/bin/python" \
            fit_gates/d41_nautilus/requirements.lock
          uv pip check --python "${d01_venv}/bin/python"

      - name: Run exactly 13 D01 tests
        if: needs.changes.outputs.heavy == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src:.
          TRADING_MODE: PAPER
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/d01-venv/bin/python" - <<'PY'
          import unittest

          expected = 13
          loader = unittest.TestLoader()
          suite = loader.loadTestsFromName("vertical_slices.d01_btc_perp.test_slice")
          if loader.errors:
              raise SystemExit("D01 collection errors:\n" + "\n".join(loader.errors))
          collected = suite.countTestCases()
          print(f"D01_COLLECTED={collected}")
          if collected != expected:
              raise SystemExit(f"expected {expected} D01 tests, collected {collected}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"D01_EXECUTED={result.testsRun}")
          nonpassing = {
              "failures": len(result.failures),
              "errors": len(result.errors),
              "skipped": len(result.skipped),
              "expected_failures": len(result.expectedFailures),
              "unexpected_successes": len(result.unexpectedSuccesses),
          }
          print(f"D01_NONPASSING={nonpassing}")
          if result.testsRun != expected:
              raise SystemExit(f"expected {expected} executions, ran {result.testsRun}")
          if not result.wasSuccessful() or any(nonpassing.values()):
              raise SystemExit(f"D01 was not an all-pass run: {nonpassing}")
          PY

      - name: Run exactly 7 D22-A tests
        if: needs.changes.outputs.heavy == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src:.
          TRADING_MODE: PAPER
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/d01-venv/bin/python" - <<'PY'
          import unittest

          expected = 7
          loader = unittest.TestLoader()
          suite = loader.loadTestsFromName("vertical_slices.d22a_paper_ledger.test_slice")
          if loader.errors:
              raise SystemExit("D22-A collection errors:\n" + "\n".join(loader.errors))
          collected = suite.countTestCases()
          print(f"D22A_COLLECTED={collected}")
          if collected != expected:
              raise SystemExit(f"expected {expected} D22-A tests, collected {collected}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"D22A_EXECUTED={result.testsRun}")
          nonpassing = {
              "failures": len(result.failures),
              "errors": len(result.errors),
              "skipped": len(result.skipped),
              "expected_failures": len(result.expectedFailures),
              "unexpected_successes": len(result.unexpectedSuccesses),
          }
          print(f"D22A_NONPASSING={nonpassing}")
          if result.testsRun != expected:
              raise SystemExit(f"expected {expected} executions, ran {result.testsRun}")
          if not result.wasSuccessful() or any(nonpassing.values()):
              raise SystemExit(f"D22-A was not an all-pass run: {nonpassing}")
          PY

      - name: Run exactly 10 COURSE-1 live-public PAPER soak tests
        if: needs.changes.outputs.heavy == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src:.
          TRADING_MODE: PAPER
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/d01-venv/bin/python" - <<'PY'
          import unittest

          expected = 10
          loader = unittest.TestLoader()
          suite = loader.loadTestsFromName(
              "vertical_slices.course1_live_public_paper.test_slice"
          )
          if loader.errors:
              raise SystemExit("Soak collection errors:\n" + "\n".join(loader.errors))
          collected = suite.countTestCases()
          print(f"SOAK_COLLECTED={collected}")
          if collected != expected:
              raise SystemExit(f"expected {expected} soak tests, collected {collected}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"SOAK_EXECUTED={result.testsRun}")
          nonpassing = {
              "failures": len(result.failures),
              "errors": len(result.errors),
              "skipped": len(result.skipped),
              "expected_failures": len(result.expectedFailures),
              "unexpected_successes": len(result.unexpectedSuccesses),
          }
          print(f"SOAK_NONPASSING={nonpassing}")
          if result.testsRun != expected:
              raise SystemExit(f"expected {expected} executions, ran {result.testsRun}")
          if not result.wasSuccessful() or any(nonpassing.values()):
              raise SystemExit(f"Soak was not an all-pass run: {nonpassing}")
          PY

      - name: Verify D01 publication and dependency closure
        if: needs.changes.outputs.heavy == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src:.
        run: |
          "${RUNNER_TEMP}/d01-venv/bin/python" \
            -m vertical_slices.d01_btc_perp.publication verify \
            --check-installed-dependencies

  typescript-foundation:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Skip docs-only change set
        if: needs.changes.outputs.heavy != 'true'
        run: echo "docs-only PR; TypeScript foundation skipped."

      - name: Check out repository
        if: needs.changes.outputs.heavy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js and pnpm
        if: needs.changes.outputs.heavy == 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Install TypeScript dependencies
        if: needs.changes.outputs.heavy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript formatting
        if: needs.changes.outputs.heavy == 'true'
        run: pnpm run format:check

      - name: Lint TypeScript
        if: needs.changes.outputs.heavy == 'true'
        run: pnpm run lint

      - name: Type-check TypeScript
        if: needs.changes.outputs.heavy == 'true'
        run: pnpm run typecheck

      - name: Test TypeScript
        if: needs.changes.outputs.heavy == 'true'
        run: pnpm run test

  regress:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Skip docs-only change set
        if: needs.changes.outputs.heavy != 'true'
        run: echo "docs-only PR; PAPER API/browser regress skipped."

      - name: Check out repository
        if: needs.changes.outputs.heavy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up uv and Python
        if: needs.changes.outputs.heavy == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
          python-version: "3.13.15"
          version: "0.12.5"

      - name: Set up Node.js and pnpm
        if: needs.changes.outputs.heavy == 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Python dependencies
        if: needs.changes.outputs.heavy == 'true'
        run: uv sync --frozen --all-groups

      - name: Run API and stream-contract regress
        if: needs.changes.outputs.heavy == 'true'
        run: uv run --frozen pytest -q tests/python/test_ci_regression_contracts.py tests/python/test_control_service.py

      - name: Install TypeScript dependencies
        if: needs.changes.outputs.heavy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Chromium
        if: needs.changes.outputs.heavy == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: needs.changes.outputs.heavy == 'true'
        run: pnpm --filter @hyperliquid-bot/cockpit exec playwright install --with-deps chromium

      - name: Build cockpit
        if: needs.changes.outputs.heavy == 'true'
        env:
          TRADING_MODE: PAPER
        run: pnpm --filter @hyperliquid-bot/cockpit run build

      - name: Run cockpit browser regress
        if: needs.changes.outputs.heavy == 'true'
        env:
          TRADING_MODE: PAPER
        run: pnpm --filter @hyperliquid-bot/cockpit run regress:browser

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          install_dir="${RUNNER_TEMP}/actionlint-bin"
          mkdir --parents "${install_dir}"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${install_dir}" actionlint
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Lint GitHub Actions workflows
        run: actionlint -color

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir --parents "${install_dir}"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${install_dir}" gitleaks
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Scan working tree
        run: gitleaks dir . --redact --no-banner

      - name: Scan full history
        run: gitleaks git . --redact --no-banner --log-opts=--all
