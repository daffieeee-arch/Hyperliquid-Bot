name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          python-version: "3.13.15"
          version: "0.12.5"

      - name: Validate lockfile
        run: uv lock --check

      - name: Install Python dependencies
        run: uv sync --frozen --all-groups

      - name: Check Python formatting
        run: uv run --frozen ruff format --check .

      - name: Lint Python
        run: uv run --frozen ruff check .

      - name: Type-check Python
        run: uv run --frozen mypy src tests/python

      - name: Test Python
        run: uv run --frozen pytest -q

  d01-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          python-version: "3.13.15"
          version: "0.12.5"

      - name: Build exact isolated D01 environment
        run: |
          set -euo pipefail
          d01_venv="${RUNNER_TEMP}/d01-venv"
          test ! -e "${d01_venv}"
          uv venv --no-project --python 3.13.15 "${d01_venv}"
          uv pip sync --no-cache --strict \
            --python "${d01_venv}/bin/python" \
            fit_gates/d41_nautilus/requirements.lock
          uv pip check --python "${d01_venv}/bin/python"

      - name: Run exactly 13 D01 tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src:.
          TRADING_MODE: PAPER
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/d01-venv/bin/python" - <<'PY'
          import unittest

          expected = 13
          loader = unittest.TestLoader()
          suite = loader.loadTestsFromName("vertical_slices.d01_btc_perp.test_slice")
          if loader.errors:
              raise SystemExit("D01 collection errors:\n" + "\n".join(loader.errors))
          collected = suite.countTestCases()
          print(f"D01_COLLECTED={collected}")
          if collected != expected:
              raise SystemExit(f"expected {expected} D01 tests, collected {collected}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"D01_EXECUTED={result.testsRun}")
          nonpassing = {
              "failures": len(result.failures),
              "errors": len(result.errors),
              "skipped": len(result.skipped),
              "expected_failures": len(result.expectedFailures),
              "unexpected_successes": len(result.unexpectedSuccesses),
          }
          print(f"D01_NONPASSING={nonpassing}")
          if result.testsRun != expected:
              raise SystemExit(f"expected {expected} executions, ran {result.testsRun}")
          if not result.wasSuccessful() or any(nonpassing.values()):
              raise SystemExit(f"D01 was not an all-pass run: {nonpassing}")
          PY

      - name: Run exactly 7 D22-A tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src:.
          TRADING_MODE: PAPER
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/d01-venv/bin/python" - <<'PY'
          import unittest

          expected = 7
          loader = unittest.TestLoader()
          suite = loader.loadTestsFromName("vertical_slices.d22a_paper_ledger.test_slice")
          if loader.errors:
              raise SystemExit("D22-A collection errors:\n" + "\n".join(loader.errors))
          collected = suite.countTestCases()
          print(f"D22A_COLLECTED={collected}")
          if collected != expected:
              raise SystemExit(f"expected {expected} D22-A tests, collected {collected}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"D22A_EXECUTED={result.testsRun}")
          nonpassing = {
              "failures": len(result.failures),
              "errors": len(result.errors),
              "skipped": len(result.skipped),
              "expected_failures": len(result.expectedFailures),
              "unexpected_successes": len(result.unexpectedSuccesses),
          }
          print(f"D22A_NONPASSING={nonpassing}")
          if result.testsRun != expected:
              raise SystemExit(f"expected {expected} executions, ran {result.testsRun}")
          if not result.wasSuccessful() or any(nonpassing.values()):
              raise SystemExit(f"D22-A was not an all-pass run: {nonpassing}")
          PY

      - name: Run exactly 10 COURSE-1 live-public PAPER soak tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src:.
          TRADING_MODE: PAPER
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/d01-venv/bin/python" - <<'PY'
          import unittest

          expected = 10
          loader = unittest.TestLoader()
          suite = loader.loadTestsFromName(
              "vertical_slices.course1_live_public_paper.test_slice"
          )
          if loader.errors:
              raise SystemExit("Soak collection errors:\n" + "\n".join(loader.errors))
          collected = suite.countTestCases()
          print(f"SOAK_COLLECTED={collected}")
          if collected != expected:
              raise SystemExit(f"expected {expected} soak tests, collected {collected}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"SOAK_EXECUTED={result.testsRun}")
          nonpassing = {
              "failures": len(result.failures),
              "errors": len(result.errors),
              "skipped": len(result.skipped),
              "expected_failures": len(result.expectedFailures),
              "unexpected_successes": len(result.unexpectedSuccesses),
          }
          print(f"SOAK_NONPASSING={nonpassing}")
          if result.testsRun != expected:
              raise SystemExit(f"expected {expected} executions, ran {result.testsRun}")
          if not result.wasSuccessful() or any(nonpassing.values()):
              raise SystemExit(f"Soak was not an all-pass run: {nonpassing}")
          PY

      - name: Verify D01 publication and dependency closure
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src:.
        run: |
          "${RUNNER_TEMP}/d01-venv/bin/python" \
            -m vertical_slices.d01_btc_perp.publication verify \
            --check-installed-dependencies

  typescript-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Node.js
        env:
          NODE_SHA256: d6c664df3f3f61458e8c277585571328522d705166723a7c7823a9253a4d15a0
          NODE_VERSION: 24.18.1
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --xz --file "${archive}" --directory "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/node-v${NODE_VERSION}-linux-x64/bin" >> "${GITHUB_PATH}"

      - name: Set up pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.23.0
          install: false

      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript formatting
        run: pnpm run format:check

      - name: Lint TypeScript
        run: pnpm run lint

      - name: Type-check TypeScript
        run: pnpm run typecheck

      - name: Test TypeScript
        run: pnpm run test

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir --parents "${install_dir}"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${install_dir}" gitleaks
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Scan working tree
        run: gitleaks dir . --redact --no-banner

      - name: Scan full history
        run: gitleaks git . --redact --no-banner --log-opts=--all
