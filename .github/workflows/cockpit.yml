name: Cockpit

on:
  pull_request:
    # ready_for_review: a draft PR skips the heavy job (see ci_scope.py);
    # marking it ready runs it on the same head.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.scope.outputs.python }}
      typescript: ${{ steps.scope.outputs.typescript }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify change set
        id: scope
        env:
          PYTHONPATH: src
          # Read-only: the live draft state of the pull request.
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 src/hyperliquid_bot/ci_scope.py

  first-paper-screen:
    needs: changes
    # Only a successful, live-confirmed draft avoids allocating a runner.
    # Missing or inconsistent classification still schedules the job.
    if: >-
      ${{ !cancelled() && !(github.event_name == 'pull_request' &&
          needs.changes.result == 'success' &&
          needs.changes.outputs.python == 'false' &&
          needs.changes.outputs.typescript == 'false' &&
          needs.changes.outputs.reason == 'draft pull request; heavy jobs run when it is marked ready for review') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Skip unaffected change set
        if: needs.changes.outputs.typescript == 'false'
        run: echo "TypeScript area not affected (docs-only, Python only, or draft PR); cockpit first-paper-screen skipped."

      - name: Check out repository
        if: needs.changes.outputs.typescript != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js and pnpm
        if: needs.changes.outputs.typescript != 'false'
        uses: ./.github/actions/setup-node-pnpm

      - name: Install TypeScript dependencies
        if: needs.changes.outputs.typescript != 'false'
        run: pnpm install --frozen-lockfile

      - name: Lint cockpit
        if: needs.changes.outputs.typescript != 'false'
        run: pnpm --filter @hyperliquid-bot/cockpit run lint

      - name: Type-check cockpit
        if: needs.changes.outputs.typescript != 'false'
        run: pnpm --filter @hyperliquid-bot/cockpit run typecheck

      - name: Test cockpit
        if: needs.changes.outputs.typescript != 'false'
        run: pnpm --filter @hyperliquid-bot/cockpit run test

      - name: Build cockpit
        if: needs.changes.outputs.typescript != 'false'
        env:
          TRADING_MODE: PAPER
        run: pnpm --filter @hyperliquid-bot/cockpit run build
