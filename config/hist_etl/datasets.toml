# Offline historical datasets for research.hist_etl.
# Paths come from --root / HIST_ARCHIVES_ROOT. This file names no host.
#
# `end = "today"` keeps the daily tail incremental.
# Disabled entries are the extra bundle (funding from 2020, older 1m and 1h
# klines, mark/index/premium 1m, USD-M metrics). Select them explicitly:
#   python -m research.hist_etl sync --dataset bn-um-btcusdt-funding-2020

min_free_bytes = 10737418240
requests_per_second = 2.0
max_retries = 5
timeout_seconds = 60.0

[[binance]]
id = "bn-spot-btcusdt-klines-1m"
market = "spot"
dataset = "klines"
symbol = "BTCUSDT"
interval = "1m"
start = "2025-09-01"
end = "today"
granularity = "monthly_with_daily_tail"

[[binance]]
id = "bn-spot-btcusdt-klines-1m-backfill"
market = "spot"
dataset = "klines"
symbol = "BTCUSDT"
interval = "1m"
start = "2017-08-17"
end = "2025-08-31"
granularity = "monthly_with_daily_tail"
enabled = false

