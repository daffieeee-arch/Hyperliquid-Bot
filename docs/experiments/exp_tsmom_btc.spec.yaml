# Pre-registered: time-series momentum on BTC (exp_tsmom_btc).
# See docs/experiments/exp_tsmom_btc.md before changing anything here: any
# edit is a new pre-registration with a new spec_sha256, not a re-run.
# Build bars.parquet next to this file (it is not committed), then lock and run.

hypothesis_id: tsmom-btc-1h-trend3
universe: binance-um-btcusdt-perp-1h
dataset_version: bn-um-btcusdt-klines-1h+funding 2020-01-01..2026-10-01, bar_tables trend 168/672/2016, vol 168
h0: Mean net return per trade of the trend rule is less than or equal to zero after costs and funding.
h1: Mean net return per trade of the trend rule is greater than zero after costs and funding on the untouched holdout.
alpha: 0.05
selection_method: holm
direction: signed
signal_feature: trend_score
costs:
  fee_bps: 4.5
  slippage_bps: 1.0
  spread_bps: 0.5
  latency_bars: 1
  funding_column: funding_rate
sizing:
  method: vol_target
  vol_feature: realized_vol
  target_vol: 0.005
  max_leverage: 2.0
split:
  method: expanding
  train_bars: 4320
  test_bars: 2160
  holdout_bars: 15312
sample:
  min_trades_validation: 40
  min_trades_holdout: 25
  min_folds: 8
data:
  backend: parquet
  parquet_path: bars.parquet
  timestamp_column: ts
  price_column: close
  max_gap: 3600000
  max_rows: 100000
  columns:
    ts:
      dtype: int64
      role: timestamp
    close:
      dtype: float64
      role: price
    trend_score:
      dtype: float64
      role: feature
    realized_vol:
      dtype: float64
      role: feature
    funding_rate:
      dtype: float64
      role: funding
    available_ts:
      dtype: int64
      role: availability
features:
  - name: trend_score
    column: trend_score
    available_at_column: available_ts
  - name: realized_vol
    column: realized_vol
    available_at_column: available_ts
configs:
  - id: any-1w
    threshold: 0.0
    horizon_bars: 168
  - id: any-2w
    threshold: 0.0
    horizon_bars: 336
  - id: all-1w
    threshold: 0.5
    horizon_bars: 168
  - id: all-2w
    threshold: 0.5
    horizon_bars: 336
