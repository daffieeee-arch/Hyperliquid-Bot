[project]
name = "hyperliquid-bot"
version = "0.0.0"
description = "PAPER-first multi-venue quantitative crypto trading platform foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb==1.5.5",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "websockets==17.0.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.4",
]

[tool.uv]
package = false
required-version = "==0.12.5"

[tool.fastapi]
entrypoint = "hyperliquid_bot.control_service.app:app"

[tool.ruff]
required-version = "==0.16.4"
target-version = "py313"
line-length = 100
src = ["src", "tests/python"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src:."

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src", "."]
testpaths = ["tests/python"]
